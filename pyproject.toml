[project]
name = "preply_hackathon"
version = "0.1.0"
description = "Preply hackathon system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Andres Gonzalez", email = "nanoandres_24@hotmail.com" }
]

#TODO: np is very basic and should be up here imo
dependencies = [
  # API / service runtime
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "openai>=1.51,<2",
  "anthropic[bedrock]>=0.40,<1",
  #"mistralai>=1.0,<2", # buttheads...

  # I/O and transport
  "httpx>=0.27,<0.28",
  "python-multipart>=0.0.9,<0.1",
  "aiofiles>=23.2,<24",
]

[project.scripts]
your-project = "your_project.cli:app"

[dependency-groups]

# LLM, see if langchain or llmindex or something else

llm = [
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langchain-openai>=0.3,<1",
  "huggingface_hub==1.7.2",
]

#TODO: overcomplicating things but for embedding retrieval useful
####retrieval = [
####  "llama-index>=0.12,<0.13",
####  "llama-index-llms-openai>=0.4,<0.5",
####]

# Document parsing (no OCR)
documents = [
  "pypdf==6.9.1",
  "python-docx>=1.1,<2",
]

apple_local = [
  "mlx-lm>=0.28,<1",
]

#TODO: if doing local runs or better yet some sort of modeling directly...
###oss_local = [
###  "transformers>=4.51,<5",
###  "torch>=2.6,<3",
###]

# TODO: test usability of this, because it may be funky with np 2
audio = [
  "numpy>=1.26,<=2.4.3",
  # "soundfile>=0.12,<0.13",  # requires system lib (libsndfile)
  "pydub>=0.25,<0.26",
]

cloud = [
  "boto3>=1.35,<2",
]

dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"  # report extra test info and report all except passes
# last line may be unnecessary, dont like hacking pythonpath, double check
