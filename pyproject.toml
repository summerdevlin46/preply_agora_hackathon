[project]
name = "preply_hackathon"
version = "0.1.0"
description = "Preply hackathon system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Andres Gonzalez", email = "nanoandres_24@hotmail.com" }
]

#TODO: np is very basic and should be up here imo
dependencies = [
  # API / service runtime
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",

  # I/O and transport
  "httpx>=0.27,<0.28",
  "python-multipart>=0.0.9,<0.1",
  "aiofiles>=23.2,<24",
]

[project.scripts]
your-project = "your_project.cli:app"

[dependency-groups]

# UI layer (optional)
ui = [
  "gradio==6.9",
]

# LLM, see if langchain or llmindex or something else

llm = [
  "openai>=1.51,<2",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langchain-openai>=0.3,<1",
]

#TODO: overcomplicating things but for embedding retrieval useful
####retrieval = [
####  "llama-index>=0.12,<0.13",
####  "llama-index-llms-openai>=0.4,<0.5",
####]

# Document parsing (no OCR)
documents = [
  "pypdf==6.9.1",
  "python-docx>=1.1,<2",
  "Pillow>=10.4,<11",
]

# OCR support (optional) Chatgpt helped for this, need to assess this and see actual OCR
# NOTE: requires system dependency: `tesseract` binary installed
ocr = [
  "pytesseract>=0.3.13,<0.4",
  "pdf2image==1.17"  # maybe unneeded
]

# TODO: test usability of this, because it may be funky with np 2
audio = [
  "numpy>=1.26,<=2.4.3",
  # "soundfile>=0.12,<0.13",  # requires system lib (libsndfile)
  "pydub>=0.25,<0.26",
]

cloud = [
  "boto3>=1.35,<2",
]

dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"  # report extra test info and report all except passes
# last line may be unnecessary, dont like hacking pythonpath, double check
