[project]
name = "preply_hackathon"
version = "0.1.0"
description = "Preply hackathon system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Andres Gonzalez", email = "nanoandres_24@hotmail.com" }
]

#TODO: np is very basic and should be up here imo
dependencies = [
  # API / service runtime
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",

  # I/O and transport
  "httpx>=0.27,<0.28",
  "python-multipart>=0.0.9,<0.1",
  "aiofiles>=23.2,<24",
]

[project.scripts]
your-project = "your_project.cli:app"

[dependency-groups]

# UI layer (optional)
ui = [
  "gradio>=4.44,<5",
]

# LLM, see if langchain or llmindex or something else
llm = [
  "openai>=1.51,<2",
  "langchain>=0.3,<0.4",
  "langchain-openai>=0.2,<0.3",
]

# Document parsing (no OCR)
documents = [
  "pymupdf>=1.24,<1.25",
  "python-docx>=1.1,<2",
  "Pillow>=10.4,<11",
]

# OCR support (optional) Chatgpt helped for this, need to assess this and see actual OCR
# NOTE: requires system dependency: `tesseract` binary installed
ocr = [
  "pytesseract>=0.3.13,<0.4",
]

audio = [
  "numpy>=1.26,<2",
  "soundfile>=0.12,<0.13",
  "pydub>=0.25,<0.26",
]

cloud = [
  "boto3>=1.35,<2",
]

dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
