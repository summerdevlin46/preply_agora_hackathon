services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afterclass-api
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AFTERCLASS_CONFIG_PATH: /app/config/afterclass.toml
      AFTERCLASS_LOCAL_OSS_BASE_URL: "http://${HOST_GATEWAY:-host.docker.internal}:8081/v1"
      AFTERCLASS_LOCAL_OSS_API_KEY: local-not-used
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./prompts:/app/prompts
      - ./data:/app/data
      - ./sample_pdfs:/app/sample_pdfs
    command: uv run python src/app.py --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./public
      dockerfile: Dockerfile.dev
    container_name: afterclass-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api
    command: npm run dev -- -H 0.0.0.0 -p 3000

volumes:
  frontend_node_modules:
  frontend_next:
