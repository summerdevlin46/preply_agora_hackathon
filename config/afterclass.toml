[model_routing]
provider = "auto"
priority = ["bedrock", "openai", "mistral", "local_oss"]

[generation.default]
max_tokens = 1200
temperature = 0.2

[generation.chat]
max_tokens = 900
temperature = 0.2

[generation.exercise]
max_tokens = 1800
temperature = 0.3

[generation.report]
max_tokens = 1000
temperature = 0.0

[generation.cleanup]
max_tokens = 900
temperature = 0.0

[generation.ocr_structuring]
max_tokens = 1800
temperature = 0.0

[generation.fallback]
enabled = false
file = "config/demo_fallbacks/cooking_present_continuous.json"
description = "Demo fallback for cooking + present continuous."

[ocr]
# priority = ["pdf_text", "mistral_ocr"]
# Only using pdf_text while Mistral OCR is being stabilized.
priority = ["pdf_text"]

[ocr.pdf_text]
enabled = true

[ocr.mistral_ocr]
enabled = true
api_key_env = "MISTRAL_API_KEY"
ocr_model = "mistral-ocr-latest"
chat_model = "mistral-small-latest"

[providers.bedrock]
kind = "bedrock"
enabled = false
model = "us.anthropic.claude-sonnet-4-6"
model_env = "AFTERCLASS_BEDROCK_MODEL"
region = "us-east-2"
region_env = "AWS_REGION"

[providers.openai]
kind = "openai_compatible"
enabled = true
model = "gpt-5"
model_env = "AFTERCLASS_OPENAI_MODEL"
api_key_env = "OPENAI_API_KEY"

[providers.openai.task_models]
ocr = "gpt-4o-mini"
exercise = "gpt-4o"

[providers.mistral]
kind = "mistral"
enabled = true
model = "mistral-large-latest"
model_env = "AFTERCLASS_MISTRAL_MODEL"
api_key_env = "MISTRAL_API_KEY"

[providers.local_oss]
kind = "openai_compatible"
enabled = true
base_url = "http://127.0.0.1:8081/v1"
base_url_env = "AFTERCLASS_LOCAL_OSS_BASE_URL"
model = "HuggingFaceTB/SmolLM2-360M-Instruct"
model_env = "AFTERCLASS_LOCAL_OSS_MODEL"
api_key_env = "AFTERCLASS_LOCAL_OSS_API_KEY"
api_key_default = "local-not-used"

[recommendations]
enabled = true
mode = "llm"

[analysis.audio_biomarkers]
enabled = false
provider = "none"
